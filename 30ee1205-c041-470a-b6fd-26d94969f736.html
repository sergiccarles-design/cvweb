<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sergi Carles — Màrqueting i Comunicació</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-soft:#F5F6FC;
    --bg-panel:#FFFFFF;
    --bg-panel-alt:#F5F6FC;
    --navy-dark:#06061C;
    --navy-mid:#14134A;
    --line:#E3E4F2;
    --line-strong:#C9CBEE;
    --text:#15151F;
    --text-dim:#5B5C72;
    --text-faint:#9B9CB5;
    --accent:#3533CD;
    --accent-soft:rgba(53,51,205,0.08);
    --accent-2:#7472E8;
    --grad-start:#06061C;
    --grad-end:#2B29A6;
    --radius-s:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Poppins',sans-serif;
    font-weight:400;
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:radial-gradient(circle at 90% 4%, rgba(53,51,205,0.06), transparent 40%);
    pointer-events:none;
    z-index:0;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;position:relative;z-index:1;}
  h1,h2,h3{font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:-0.01em;}
  .mono{font-family:'Poppins',sans-serif;}
  a{color:inherit;text-decoration:none;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  /* ===== NAV ===== */
  header.nav{
    position:fixed;top:0;left:0;right:0;z-index:50;
    background:rgba(255,255,255,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:1180px;margin:0 auto;padding:0 32px;
    height:64px;display:flex;align-items:center;justify-content:space-between;
  }
  .logo{
    display:flex;align-items:center;gap:9px;
    font-family:'Poppins',sans-serif;font-weight:800;font-size:1.35rem;
    color:var(--text);
  }
  .logo .tally{
    width:10px;height:10px;background:var(--accent);border-radius:50%;
    box-shadow:0 0 0 4px var(--accent-soft);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.4;}
  }
  .lang-switch{display:flex;gap:2px;background:var(--bg-soft);border:1px solid var(--line);border-radius:20px;padding:3px;}
  .lang-switch button{
    font-family:'Poppins',sans-serif;font-size:0.76rem;font-weight:600;
    padding:6px 14px;border:none;background:transparent;color:var(--text-dim);
    border-radius:16px;cursor:pointer;transition:background .2s,color .2s;
    letter-spacing:0.02em;
  }
  .lang-switch button.active{background:var(--accent);color:#fff;}
  .lang-switch button:not(.active):hover{color:var(--text);}

  /* ===== HERO ===== */
  .hero{
    position:relative;
    background:linear-gradient(115deg, var(--grad-start) 5%, var(--grad-end) 92%);
    color:#fff;
    padding-top:150px;padding-bottom:0;
    overflow:hidden;
    width:100vw;margin-left:calc(-50vw + 50%);margin-right:calc(-50vw + 50%);
    padding-left:calc(50vw - 50% + 32px);padding-right:calc(50vw - 50% + 32px);
  }
  .hero::after{
    content:"";position:absolute;top:-30%;right:-10%;width:60%;height:160%;
    background:radial-gradient(circle, rgba(255,255,255,0.10), transparent 65%);
    pointer-events:none;
  }
  .hero-inner{position:relative;z-index:1;max-width:1116px;margin:0 auto;}
  .status-badge{
    display:inline-flex;align-items:center;gap:9px;
    font-size:0.82rem;font-weight:500;letter-spacing:0.02em;
    color:#fff;
    border:1.5px solid rgba(255,255,255,0.5);
    padding:8px 16px 8px 12px;border-radius:30px;
    margin-bottom:36px;width:fit-content;
  }
  .status-badge .dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite;}
  .hero-grid{display:grid;grid-template-columns:1fr 280px;gap:56px;align-items:center;}
  .hero-kicker{
    font-size:0.95rem;font-weight:600;color:#C7C6FF;
    margin-bottom:16px;letter-spacing:0.02em;
  }
  .hero-name{
    font-size:clamp(3.4rem,9vw,6.6rem);
    font-weight:900;
    line-height:0.92;
    margin-bottom:24px;
    color:#fff;
  }
  .hero-lead{
    font-size:clamp(1.02rem,1.8vw,1.25rem);
    color:rgba(255,255,255,0.82);
    max-width:540px;
    font-weight:400;
    margin-bottom:38px;
  }
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    font-family:'Poppins',sans-serif;font-weight:600;font-size:0.92rem;
    padding:14px 28px;border-radius:30px;cursor:pointer;border:1.5px solid transparent;
    transition:transform .15s ease, background .2s, border-color .2s, color .2s;
    display:inline-block;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:#fff;color:var(--accent);}
  .btn-primary:hover{background:#EDEDFF;}
  .btn-ghost{border-color:rgba(255,255,255,0.55);color:#fff;}
  .btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,0.08);}
  footer .btn-ghost{border-color:rgba(255,255,255,0.55);color:#fff;}

  .hero-portrait{position:relative;justify-self:center;width:100%;max-width:250px;}
  .portrait-frame{
    position:relative;border-radius:50%;padding:8px;
    background:rgba(255,255,255,0.08);
    border:1.5px solid rgba(255,255,255,0.35);
  }
  .portrait-frame img{
    width:100%;display:block;border-radius:50%;
    aspect-ratio:1/1;object-fit:cover;
  }
  .stats-row{
    display:grid;grid-template-columns:repeat(3,1fr);
    border-top:1px solid rgba(255,255,255,0.18);
    margin-top:60px;
    position:relative;z-index:1;
  }
  .stat{padding:26px 22px 30px 0;border-right:1px solid rgba(255,255,255,0.18);}
  .stat:last-child{border-right:none;}
  .stat-num{font-family:'Poppins',sans-serif;font-weight:800;font-size:2.6rem;color:#fff;line-height:1;}
  .stat-label{font-size:0.85rem;color:rgba(255,255,255,0.72);margin-top:8px;max-width:190px;}

  /* ===== SECTION SHARED ===== */
  section{padding:110px 0;position:relative;z-index:1;}
  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:52px;}
  .sec-idx{font-weight:700;color:var(--accent);font-size:0.9rem;}
  .sec-title{font-size:clamp(1.9rem,3.8vw,2.6rem);color:var(--accent);text-transform:uppercase;letter-spacing:0.01em;}

  /* ===== ABOUT ===== */
  .about-grid{display:grid;grid-template-columns:270px 1fr;gap:60px;}
  .about-facts{display:flex;flex-direction:column;gap:20px;}
  .fact{border-left:3px solid var(--accent);padding-left:16px;}
  .fact-label{font-size:0.72rem;font-weight:600;color:var(--text-faint);letter-spacing:0.05em;margin-bottom:4px;text-transform:uppercase;}
  .fact-value{font-size:0.98rem;color:var(--text);font-weight:500;}
  .fact-value a:hover{color:var(--accent);}
  .about-text p{font-size:1.08rem;color:var(--text-dim);max-width:640px;margin-bottom:20px;}
  .about-text p:last-child{margin-bottom:0;}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;}
  .chip{
    font-size:0.82rem;font-weight:600;color:var(--accent);
    border:1.5px solid var(--line-strong);background:var(--accent-soft);
    padding:8px 15px;border-radius:20px;
  }

  /* ===== EXPERIENCE / RUNDOWN ===== */
  .rundown{position:relative;padding-left:28px;border-left:2px solid var(--line-strong);}
  .rundown-item{
    display:grid;grid-template-columns:160px 1fr;gap:36px;
    padding:0 0 46px;position:relative;
  }
  .rundown-item:last-child{padding-bottom:0;}
  .rundown-item::before{
    content:"";position:absolute;left:-34px;top:6px;width:12px;height:12px;border-radius:50%;
    background:#fff;border:3px solid var(--accent);
  }
  .rd-time{color:var(--accent);font-size:0.88rem;font-weight:600;padding-top:2px;}
  .rd-role{font-size:1.32rem;font-weight:700;color:var(--text);margin-bottom:3px;}
  .rd-org{font-size:0.88rem;font-weight:500;font-style:italic;color:var(--text-dim);margin-bottom:16px;}
  .rd-bullets{display:grid;gap:10px;max-width:640px;}
  .rd-bullets div{font-size:0.97rem;color:var(--text-dim);padding-left:16px;position:relative;}
  .rd-bullets div::before{content:"";position:absolute;left:0;top:9px;width:6px;height:2px;background:var(--accent);border-radius:2px;}
  .rd-bullets b{color:var(--text);font-weight:600;}

  /* ===== TOOLKIT ===== */
  .tool-groups{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;}
  .tool-group{border:1.5px solid var(--line-strong);border-radius:var(--radius-s);padding:26px 26px 22px;background:var(--bg-panel);}
  .tool-group-name{font-size:0.85rem;font-weight:500;font-style:italic;color:var(--text-dim);letter-spacing:0.01em;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .tool-list{display:flex;flex-wrap:wrap;gap:8px;}
  .tool-item{font-size:0.86rem;font-weight:600;color:var(--text);background:var(--bg-soft);border:1px solid var(--line);padding:7px 13px;border-radius:8px;}

  /* ===== CERTS + EDU ===== */
  .cert-edu-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;}
  .list-block h3{font-weight:700;font-size:1.1rem;margin-bottom:24px;color:var(--accent);text-transform:uppercase;}
  .cert-row{padding:15px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;}
  .cert-row:last-child{border-bottom:1px solid var(--line);}
  .cert-name{font-size:0.95rem;font-weight:600;color:var(--text);}
  .cert-org{font-size:0.82rem;font-style:italic;color:var(--text-dim);white-space:nowrap;}
  .edu-row{padding:18px 0;border-top:1px solid var(--line);}
  .edu-row:last-child{border-bottom:1px solid var(--line);}
  .edu-title{font-weight:700;font-size:1rem;color:var(--text);}
  .edu-meta{display:flex;justify-content:space-between;margin-top:4px;}
  .edu-school{font-size:0.86rem;font-style:italic;color:var(--text-dim);}
  .edu-dates{font-size:0.82rem;font-weight:600;color:var(--accent);}

  /* ===== LANGUAGES / METER ===== */
  .lang-meters{display:grid;gap:26px;max-width:640px;}
  .meter-row{display:grid;grid-template-columns:120px 1fr 100px;align-items:center;gap:20px;}
  .meter-name{font-weight:600;font-size:1rem;}
  .meter-track{height:10px;background:var(--bg-soft);border-radius:6px;border:1px solid var(--line);position:relative;overflow:hidden;}
  .meter-fill{
    height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent-2),var(--accent));
    width:0%;transition:width 1.4s cubic-bezier(.16,.8,.3,1);
  }
  .meter-level{font-size:0.82rem;font-weight:600;color:var(--accent);text-align:right;}

  /* ===== FOOTER / CONTACT ===== */
  footer{
    padding:110px 0 50px;margin-top:0;
    background:linear-gradient(115deg, var(--grad-start) 5%, var(--grad-end) 92%);
    color:#fff;
  }
  .footer-title{font-size:clamp(2.1rem,5.4vw,3.8rem);font-weight:800;line-height:1.05;max-width:820px;margin-bottom:44px;color:#fff;}
  .footer-links{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:70px;}
  .footer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;border-top:1px solid rgba(255,255,255,0.2);padding-top:30px;}
  .footer-fact-label{font-size:0.72rem;font-weight:600;letter-spacing:0.04em;color:#B8B7F5;margin-bottom:6px;text-transform:uppercase;}
  .footer-fact-value{font-size:0.95rem;color:#fff;}
  .footer-fact-value a:hover{color:#C7C6FF;}
  .footer-bottom{margin-top:60px;font-size:0.8rem;color:#9C9BE0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}

  @media (max-width:860px){
    .wrap{padding:0 20px;}
    .hero{padding-top:120px;}
    .hero-grid{grid-template-columns:1fr;}
    .hero-portrait{max-width:170px;justify-self:start;order:-1;margin-bottom:24px;}
    .stats-row{grid-template-columns:1fr;}
    .stat{border-right:none;border-bottom:1px solid rgba(255,255,255,0.18);padding:18px 0;}
    .about-grid{grid-template-columns:1fr;gap:34px;}
    .rundown{padding-left:20px;}
    .rundown-item{grid-template-columns:1fr;gap:8px;}
    .rundown-item::before{left:-26px;}
    .tool-groups{grid-template-columns:1fr;}
    .cert-edu-grid{grid-template-columns:1fr;gap:50px;}
    .meter-row{grid-template-columns:80px 1fr 60px;gap:12px;}
    .footer-grid{grid-template-columns:1fr;}
    section{padding:70px 0;}
  }
</style>
</head>
<body>

  <div class="nav-inner">
    <div class="logo"><span class="tally"></span>SC</div>
    <div class="lang-switch" id="langSwitch">
      <button data-lang="ca">CA</button>
      <button data-lang="es">ES</button>
      <button data-lang="en">EN</button>

let currentLang = 'ca';

function renderStatic(lang){
  const d = DATA[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const key = el.getAttribute('data-t');
    if(d[key] !== undefined) el.textContent = d[key];
  });
}

function renderChips(lang){
  const d = DATA[lang];
  document.getElementById('chips').innerHTML = d.chips.map(c=>`<span class="chip">${c}</span>`).join('');
}

function renderRundown(lang){
  const d = DATA[lang];
  document.getElementById('rundown').innerHTML = d.exp.map(item=>`
    <div class="rundown-item">
      <div class="rd-time mono">${item.time}</div>
      <div>
        <div class="rd-role">${item.role}</div>
        <div class="rd-org">${item.org}</div>
        <div class="rd-bullets">${item.bullets.map(b=>`<div>${b}</div>`).join('')}</div>
      </div>
    </div>
  `).join('');
}

function renderTools(lang){
  const d = DATA[lang];
  document.getElementById('toolGroups').innerHTML = d.toolGroups.map(g=>`
    <div class="tool-group">
      <div class="tool-group-name">${g.name}</div>
      <div class="tool-list">${g.items.map(i=>`<span class="tool-item">${i}</span>`).join('')}</div>
    </div>
  `).join('');
}

function renderCertsEdu(lang){
  const d = DATA[lang];
  document.getElementById('certList').innerHTML = d.certs.map(c=>`
    <div class="cert-row"><span class="cert-name">${c.name}</span><span class="cert-org mono">${c.org}</span></div>
  `).join('');
  document.getElementById('eduList').innerHTML = d.edu.map(e=>`
    <div class="edu-row">
      <div class="edu-title">${e.title}</div>
      <div class="edu-meta"><span class="edu-school">${e.school}</span><span class="edu-dates mono">${e.dates}</span></div>
    </div>
  `).join('');
}

function renderLangs(lang){
  const d = DATA[lang];
  document.getElementById('langMeters').innerHTML = d.langs.map(l=>`
    <div class="meter-row">
      <div class="meter-name">${l.name}</div>
      <div class="meter-track"><div class="meter-fill" data-pct="${l.pct}"></div></div>
      <div class="meter-level mono">${l.level}</div>
    </div>
  `).join('');
  requestAnimationFrame(()=>{
    document.querySelectorAll('.meter-fill').forEach(f=>{
      f.style.width = f.getAttribute('data-pct') + '%';
    });
  });
}

function renderAll(lang){
  currentLang = lang;
  renderStatic(lang);
  renderChips(lang);
  renderRundown(lang);
  renderTools(lang);
  renderCertsEdu(lang);
  renderLangs(lang);
  document.querySelectorAll('#langSwitch button').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-lang') === lang);
  });
}

document.getElementById('langSwitch').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  renderAll(btn.getAttribute('data-lang'));
});

renderAll('ca');
